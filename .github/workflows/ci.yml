# Runs the tests and builds the Docker image on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t draftic .
      - name: Start it and check it answers
        run: |
          docker run -d --name draftic -p 8010:8010 draftic
          for i in $(seq 30); do curl -sf localhost:8010/health && exit 0; sleep 2; done
          docker logs draftic
          exit 1
